<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>One oversight step, three pairs</title>
<desc>A package states which state versions it presented; a record states which it reviewed. When the two disagree, every check either artefact can run on itself still passes.</desc>

<rect x="0" y="0" width="900" height="800" fill="#ffffff"/>
<text x="32" y="42" font-size="21" font-weight="600" fill="#1f2328">One oversight step, three pairs</text>
<text x="32" y="68" font-size="13" fill="#656d76">A package says what it presented. A record says what it reviewed. The rule compares the two statements — nothing else.</text>

<g>
<text x="32" y="118" font-size="15" font-weight="600" fill="#1a7f37">A</text>
<text x="60" y="118" font-size="13" fill="#1f2328">the record names a version the package presented</text>

<rect x="60" y="132" width="248" height="104" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="76" y="156" font-size="11" fill="#656d76" letter-spacing="0.4">PACKAGE</text>
<text x="76" y="178" font-size="13" font-weight="600" fill="#1f2328">PKG-OSBRIEF-01-a</text>
<text x="76" y="200" font-size="13" fill="#1f2328">presented: s003, s005</text>
<text x="76" y="222" font-size="11" fill="#656d76">two clarification rounds</text>

<path d="M320 184 L392 184" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="404" y="156" width="76" height="26" rx="13" fill="#dafbe1" stroke="#1a7f37"/>
<text x="442" y="174" font-size="12" font-weight="600" fill="#1a7f37" text-anchor="middle">PASS</text>
<text x="442" y="202" font-size="11" fill="#656d76" text-anchor="middle">s005 was presented</text>

<path d="M492 184 L560 184" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="572" y="132" width="296" height="104" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="588" y="156" font-size="11" fill="#656d76" letter-spacing="0.4">RECORD</text>
<text x="588" y="178" font-size="13" font-weight="600" fill="#1f2328">reviewed: s005</text>
<text x="588" y="200" font-size="13" fill="#1f2328">executed: s006</text>
<text x="588" y="222" font-size="11" fill="#656d76">signed 11:40 — before execution</text>
</g>

<g>
<text x="32" y="286" font-size="15" font-weight="600" fill="#cf222e">B</text>
<text x="60" y="286" font-size="13" fill="#1f2328">the record names a version the package never presented</text>

<rect x="60" y="300" width="248" height="104" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="76" y="324" font-size="11" fill="#656d76" letter-spacing="0.4">PACKAGE</text>
<text x="76" y="346" font-size="13" font-weight="600" fill="#1f2328">PKG-OSBRIEF-01-a</text>
<text x="76" y="368" font-size="13" fill="#1f2328">presented: s003, s005</text>
<text x="76" y="390" font-size="11" fill="#656d76">s007 never appears</text>

<path d="M320 352 L392 352" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="404" y="324" width="76" height="26" rx="13" fill="#ffebe9" stroke="#cf222e"/>
<text x="442" y="342" font-size="12" font-weight="600" fill="#cf222e" text-anchor="middle">DEFECT</text>
<text x="442" y="370" font-size="11" fill="#656d76" text-anchor="middle">s007 was never</text>
<text x="442" y="384" font-size="11" fill="#656d76" text-anchor="middle">presented</text>

<path d="M492 352 L560 352" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="572" y="300" width="296" height="104" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="588" y="324" font-size="11" fill="#656d76" letter-spacing="0.4">RECORD</text>
<text x="588" y="346" font-size="13" font-weight="600" fill="#1f2328">reviewed: s007</text>
<text x="588" y="368" font-size="13" fill="#1f2328">executed: s008</text>
<text x="588" y="390" font-size="11" fill="#656d76">signed 11:40 — before execution</text>
</g>

<g>
<rect x="60" y="428" width="808" height="54" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
<text x="76" y="450" font-size="12" font-weight="600" fill="#7d4e00">Every check either artefact can run on itself passes in BOTH A and B</text>
<text x="76" y="469" font-size="12" fill="#7d4e00">The record is well formed · s007 exists in the revision · the signature is present. The difference is not in either document.</text>
</g>

<g>
<text x="32" y="540" font-size="15" font-weight="600" fill="#9a6700">C</text>
<text x="60" y="540" font-size="13" fill="#1f2328">the same defect as B, with one field changed: the signing time moved after execution</text>

<rect x="60" y="554" width="248" height="104" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="76" y="578" font-size="11" fill="#656d76" letter-spacing="0.4">PACKAGE</text>
<text x="76" y="600" font-size="13" font-weight="600" fill="#1f2328">PKG-OSBRIEF-01-a</text>
<text x="76" y="622" font-size="13" fill="#1f2328">presented: s003, s005</text>
<text x="76" y="644" font-size="11" fill="#656d76">identical to B</text>

<path d="M320 606 L392 606" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="404" y="578" width="76" height="26" rx="13" fill="#fff8c5" stroke="#9a6700"/>
<text x="442" y="596" font-size="12" font-weight="600" fill="#9a6700" text-anchor="middle">PASS</text>
<text x="442" y="624" font-size="11" fill="#656d76" text-anchor="middle">read as a</text>
<text x="442" y="638" font-size="11" fill="#656d76" text-anchor="middle">post-hoc audit</text>

<path d="M492 606 L560 606" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="572" y="554" width="296" height="104" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="588" y="578" font-size="11" fill="#656d76" letter-spacing="0.4">RECORD</text>
<text x="588" y="600" font-size="13" font-weight="600" fill="#1f2328">reviewed: s007</text>
<text x="588" y="622" font-size="13" fill="#1f2328">executed: s008</text>
<text x="588" y="644" font-size="11" fill="#cf222e">signed 16:20 — after execution (16:00)</text>
</g>

<g>
<rect x="60" y="682" width="808" height="54" rx="6" fill="#ffebe9" stroke="#cf222e"/>
<text x="76" y="704" font-size="12" font-weight="600" fill="#82071e">This is the hole the repository documents rather than closes</text>
<text x="76" y="723" font-size="12" fill="#82071e">Nothing in the record can refute the signing time it carries. Closing it needs a time source the author cannot rewrite — infrastructure, not a schema.</text>
</g>

<text x="32" y="770" font-size="11" fill="#656d76">Reproduce: python demo.py · python selfcheck.py · python run.py · python ablation.py</text>
<text x="868" y="770" font-size="11" fill="#656d76" text-anchor="end">oversight-record-vectors</text>

<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>
